          notebook_task:
            notebook_path: /Workspace/Users/celiojunio878@gmail.com/cinedata-analytics/notebooks/Bronze_to_Silver
            source: WORKSPACE
        - task_key: to_Gold
          depends_on:
            - task_key: to_Silver
          notebook_task:
            notebook_path: /Workspace/Users/celiojunio878@gmail.com/cinedata-analytics/notebooks/Silver_to_Gold
            source: WORKSPACE
