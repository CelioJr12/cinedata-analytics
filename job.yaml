        quartz_cron_expression: 18 0 10 * * ?
        timezone_id: America/Fortaleza
        pause_status: UNPAUSED
      tasks:
        - task_key: to_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/celiojunio878@gmail.com/cinedata-analytics/notebooks/Landing_to_Bronze
